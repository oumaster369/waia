name: linear-done

# On merge to dev: transition **explicit** Linear issue (from PR body) to Done.
# Never infers solely from PR title. Skips + warns on ambiguity.

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-done:
    name: Linear Done on merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Linear id (explicit field only path)
        id: resolve
        env:
          MODE: linear-done
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/linear/validate-pr-linear-id.sh

          if [[ -z "${LINEAR_API_KEY:-}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=LINEAR_API_KEY not configured" >> "$GITHUB_OUTPUT"
            echo "::notice::LINEAR_API_KEY secret not configured — skipping Linear Done automation."
            exit 0
          fi

          set +e
          result="$(scripts/linear/validate-pr-linear-id.sh 2>&1)"
          code=$?
          set -e

          if [[ $code -eq 2 || $code -eq 1 ]]; then
            skip_reason="$(printf '%s' "$result" | sed -n 's/^SKIP_REASON=//p' | head -1)"
            keep_open_reason="$(printf '%s' "$result" | sed -n 's/^KEEP_OPEN_REASON=//p' | head -1)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
            echo "keep_open_reason<<EOF_KEEP_OPEN" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$keep_open_reason" >> "$GITHUB_OUTPUT"
            echo "EOF_KEEP_OPEN" >> "$GITHUB_OUTPUT"
            echo "reason<<EOF_SKIP" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
            echo "EOF_SKIP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dee_id="$(printf '%s' "$result" | sed -n 's/^RESOLVED_DEE_ID=//p' | head -1)"
          if [[ -z "$dee_id" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=Could not resolve RESOLVED_DEE_ID from validation" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "dee_id=${dee_id}" >> "$GITHUB_OUTPUT"

      - name: Mark Linear issue Done
        if: steps.resolve.outputs.skip != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEE_ID: ${{ steps.resolve.outputs.dee_id }}
        run: |
          set -euo pipefail
          set +e
          output="$(./scripts/linear/mark-done.sh "$DEE_ID" "$PR_URL" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ $code -ne 0 ]]; then
            echo "::error::Linear mark-done failed (exit ${code})"
            exit "$code"
          fi
          if printf '%s' "$output" | grep -q 'already'; then
            echo "::notice::Linear ${DEE_ID} was already Done — idempotent success."
          else
            echo "::notice::Linear ${DEE_ID} marked Done."
          fi

      - name: Warn on skipped auto-close
        if: steps.resolve.outputs.skip == 'true'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.resolve.outputs.reason }}
          SKIP_REASON: ${{ steps.resolve.outputs.skip_reason }}
          KEEP_OPEN_REASON: ${{ steps.resolve.outputs.keep_open_reason }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          script: |
            const marker = "<!-- waia-linear-done-skip -->";
            const pr = context.payload.pull_request;
            if (!pr) return;

            const reason = (process.env.REASON || "unknown").trim();
            const skipReason = (process.env.SKIP_REASON || "").trim();
            const keepOpenReason = (process.env.KEEP_OPEN_REASON || "").trim();
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/dev/docs/waia-governance/POST-MERGE-PROTOCOL.md`;

            let body;
            if (skipReason === "explicit_keep_open") {
              body =
                `${marker}\n### Linear issue intentionally kept open\n\n` +
                `Merged PR used the validated **Linear completion:** \`keep-open\` contract.\n\n` +
                `The linked Linear issue **remains active by design**. No manual Done transition is required.\n\n` +
                `**Validated keep-open reason:**\n\n> ${keepOpenReason || "(none recorded)"}\n\n` +
                `Post-merge reconciliation must verify the parent/integration issue is still active before follow-on work.\n\n` +
                `_PR: ${process.env.PR_URL}_`;
            } else {
              body =
                `${marker}\n### Linear Done automation skipped\n\n` +
                `Merged PR was **not** auto-closed in Linear.\n\n` +
                `**Reason:**\n\`\`\`\n${reason}\n\`\`\`\n\n` +
                `**Required:** PR body must include explicit \`**Linear:** \\\`DEE-NN\\\`\` matching groomed issue scope.\n` +
                `Update Linear manually per [POST-MERGE-PROTOCOL.md](${repoUrl}).\n\n` +
                `_PR: ${process.env.PR_URL}_`;
            }

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => typeof c.body === "string" && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
