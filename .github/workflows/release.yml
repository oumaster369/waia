name: release

# Official release identity is an explicit Human-invoked tag/release of an exact
# main SHA. Merge into canonical main and official release are separate concepts.
# Do NOT auto-release on every push/merge to main.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Override tag (default: vYYYY.MM.DD.<short-sha>)"
        required: false
        type: string
      target_sha:
        description: "Exact main SHA to tag (default: current workflow SHA / checked-out HEAD)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Compute tag and target SHA
        id: tag
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          if [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$(date -u +%Y.%m.%d).$(git rev-parse --short HEAD)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} @ ${TARGET_SHA}"

      - name: Generate release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/github/generate-release-notes.sh
          NOTES="$(./scripts/github/generate-release-notes.sh)"
          {
            echo "body<<EOF_RELEASE_BODY"
            echo "$NOTES"
            echo "EOF_RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.target_sha }}
          name: WAIA ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Verify release tag peel
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          EXPECTED_SHA="${{ steps.tag.outputs.target_sha }}"

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

          ACTUAL_SHA="$(git rev-parse "${TAG}^{commit}")"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release tag peel mismatch: ${ACTUAL_SHA} != ${EXPECTED_SHA}"
            exit 1
          fi

          echo "Release tag verified: ${TAG} -> ${ACTUAL_SHA}"
