name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.data/ci-unit.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - run: pnpm test --run

  # RELEASE-BLOCKING GATE (ADR-0007): any cross-organization access leak blocks merge/release.
  # Owner: Architect / backend label. Tests are classified by the `tenant-isolation` filename
  # convention so every current and future org-scoped isolation suite runs here.
  tenant-isolation:
    name: tenant isolation gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.data/ci-isolation.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - name: Run tenant-isolation suites (release blocker)
        run: pnpm test --run tenant-isolation

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tenant-isolation]
    env:
      DATABASE_URL: file:./.data/ci-build.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - run: pnpm build

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    needs: [build]
    env:
      DATABASE_URL: file:./.data/ci-e2e.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:fhv-csrf
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
