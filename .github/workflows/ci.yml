name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  fhv-t4a-packet:
    name: fhv t4a packet gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate FHV T4A packet contract
        run: corepack pnpm@10 validate:fhv-t4a-packet

  fhv-public-ceremony-packet:
    name: fhv public ceremony packet gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate FHV public ceremony packet contract
        run: corepack pnpm@10 validate:fhv-public-ceremony-packets

  fhv-idhps-structural-gate:
    name: fhv idhps structural complexity gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.data/ci-fhv-idhps-structural.sqlite
      FHV_OFFICIAL_SCALE_ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/fhv-official-scale
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data .artifacts/fhv-official-scale && pnpm db:migrate
      - name: Record FINAL_HEAD
        run: git rev-parse HEAD > .artifacts/fhv-official-scale/FINAL_HEAD.txt
      - name: Run IDHPS structural GS suite
        run: corepack pnpm@10 test:fhv:idhps:structural
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhv-idhps-structural-artifacts
          path: .artifacts/fhv-official-scale/
          retention-days: 7

  fhv-idhps-process-parity-gate:
    name: fhv idhps process parity gate
    runs-on: ubuntu-latest
    needs: [fhv-idhps-structural-gate]
    timeout-minutes: 60
    env:
      DATABASE_URL: file:./.data/ci-fhv-official-scale.sqlite
      FHV_OFFICIAL_SCALE_ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/fhv-official-scale
      FHV_IDHPS_SKIP_REGIME_TIMELINE: "1"
      FHV_IDHPS_EVIDENCE_BATCH_CYCLES: "512"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data .artifacts/fhv-official-scale && pnpm db:migrate
      - name: Record FINAL_HEAD
        run: git rev-parse HEAD > .artifacts/fhv-official-scale/FINAL_HEAD.txt
      - name: Run process-parity
        run: corepack pnpm@10 test:fhv:official-scale:process-parity
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhv-idhps-process-parity-artifacts
          path: .artifacts/fhv-official-scale/
          retention-days: 7

  fhv-idhps-durability-gate:
    name: fhv idhps durability fault-injection gate
    runs-on: ubuntu-latest
    needs: [fhv-idhps-process-parity-gate]
    env:
      DATABASE_URL: file:./.data/ci-fhv-idhps-durability.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - name: Run parent durability RED suite
        run: corepack pnpm@10 test:fhv:idhps:durability

  fhv-idhps-stability-gate:
    name: fhv idhps stability gate
    runs-on: ubuntu-latest
    needs: [fhv-idhps-durability-gate]
    timeout-minutes: 90
    env:
      DATABASE_URL: file:./.data/ci-fhv-idhps-stability.sqlite
      FHV_OFFICIAL_SCALE_ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/fhv-official-scale
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data .artifacts/fhv-official-scale && pnpm db:migrate
      - name: Run IDHPS stability ladder
        run: corepack pnpm@10 test:fhv:idhps:stability
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhv-idhps-stability-artifacts
          path: .artifacts/fhv-official-scale/
          retention-days: 7

  fhv-idhps-canonical-probe-gate:
    name: fhv idhps canonical probe gate
    # Public ARM64 Linux (4 vCPU / 16 GiB) — macos-latest M1 is 3 vCPU / 7 GiB and ~3× slower.
    runs-on: ubuntu-24.04-arm
    needs: [fhv-idhps-stability-gate]
    timeout-minutes: 60
    env:
      DATABASE_URL: file:./.data/ci-fhv-official-scale.sqlite
      FHV_OFFICIAL_SCALE_ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/fhv-official-scale
      FHV_IDHPS_PROBE_MIN_BARS_PER_SECOND: "1000"
      FHV_IDHPS_SKIP_REGIME_TIMELINE: "1"
      FHV_IDHPS_TIMINGS: "1"
      FHV_IDHPS_EVIDENCE_BATCH_CYCLES: "1024"
      NODE_ENV: production
      # Larger young-gen reduces GC pressure on the STREAM_ONLY hot path.
      NODE_OPTIONS: "--max-semi-space-size=1536 --max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data .artifacts/fhv-official-scale && pnpm db:migrate
      - name: Run canonical probe (≥1000 bars/s feasibility)
        run: corepack pnpm@10 test:fhv:official-scale:probe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhv-idhps-probe-artifacts
          path: .artifacts/fhv-official-scale/
          retention-days: 7

  fhv-idhps-full-corpus-gate:
    name: fhv idhps full corpus gate
    runs-on: ubuntu-24.04-arm
    needs: [fhv-idhps-canonical-probe-gate]
    timeout-minutes: 180
    env:
      DATABASE_URL: file:./.data/ci-fhv-official-scale.sqlite
      FHV_OFFICIAL_SCALE_ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/fhv-official-scale
      FHV_IDHPS_SKIP_REGIME_TIMELINE: "1"
      FHV_IDHPS_EVIDENCE_BATCH_CYCLES: "1024"
      NODE_ENV: production
      NODE_OPTIONS: "--max-semi-space-size=1536 --max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Restore probe metrics (feasibility precondition)
        uses: actions/download-artifact@v4
        with:
          name: fhv-idhps-probe-artifacts
          path: .artifacts/fhv-official-scale
      - name: Disk preflight + migrate
        run: |
          mkdir -p .data .artifacts/fhv-official-scale
          pnpm db:migrate
          git rev-parse HEAD > .artifacts/fhv-official-scale/FINAL_HEAD.txt
          AVAILABLE=$(df -PB1 . | awk 'NR==2 {print $4}')
          echo "availableBytes=$AVAILABLE"
          test "$AVAILABLE" -ge 28000000000 || echo "WARN: availableBytes below 28GiB floor; projection must still satisfy 70/30"
          test -f .artifacts/fhv-official-scale/fhv-official-scale-metrics.v1.json
      - name: Run full-corpus only
        timeout-minutes: 125
        run: corepack pnpm@10 test:fhv:official-scale:full-corpus
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhv-idhps-full-corpus-artifacts
          path: .artifacts/fhv-official-scale/
          retention-days: 7

  fhv-release-validation-gate:
    name: fhv release validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate release canon and FHV ceremony contracts
        run: |
          corepack pnpm@10 validate:canon
          corepack pnpm@10 validate:fhv-t4a-packet
          corepack pnpm@10 validate:fhv-public-ceremony-packets
          corepack pnpm@10 validate:pr-governance

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.data/ci-unit.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - run: pnpm test --run

  # RELEASE-BLOCKING GATE (ADR-0007): any cross-organization access leak blocks merge/release.
  # Owner: Architect / backend label. Tests are classified by the `tenant-isolation` filename
  # convention so every current and future org-scoped isolation suite runs here.
  tenant-isolation:
    name: tenant isolation gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.data/ci-isolation.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - name: Run tenant-isolation suites (release blocker)
        run: pnpm test --run tenant-isolation

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, tenant-isolation, fhv-t4a-packet, fhv-public-ceremony-packet, fhv-idhps-full-corpus-gate, fhv-release-validation-gate]
    env:
      DATABASE_URL: file:./.data/ci-build.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - run: pnpm build

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    needs: [build]
    env:
      DATABASE_URL: file:./.data/ci-e2e.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .data && pnpm db:migrate
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:fhv-csrf
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
