env:
  DATABASE_URL_POSTGRES: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it
  DATABASE_URL_POSTGRES_SESSION: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it
  # Canonical verification is release-bound. For PRs, github.sha is the
  # synthetic merge commit, so bind receipts to the exact reviewed head.
  WAIA_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capital-authority:
    name: PostgreSQL capital authority (executed proof required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_it"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude and complete Postgres migrations
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Required actual-Postgres capital authority regressions (no skipped proof)
        env:
          WAIA_PG_INTEGRATION: "1"
          WAIA_TRADER_CLI: "1"
          WAIA_POSTGRES_CLI: "1"
        run: |
          mkdir -p .tmp
          rm -f .tmp/capital-postgres-results.json
          pnpm test --run --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/capital-postgres-results.json \
            tests/integration/postgres-execution-v2.test.ts \
            tests/integration/postgres-risk-v2.test.ts \
            tests/integration/postgres-risk-limits-bootstrap.test.ts \
            tests/integration/postgres-trader-service-actor-authorization.test.ts \
            tests/integration/postgres-reality-v2.test.ts \
            tests/integration/postgres-canonical-decision-verification-v2.test.ts \
            tests/integration/postgres-promotion-audit-atomicity.test.ts \
            tests/integration/postgres-runtime-authority-v2.test.ts \
            tests/integration/postgres-guardian-authority-v2.test.ts \
            tests/integration/postgres-forecast-v2-feedback-read-port.test.ts \
            tests/integration/postgres-forecast-v2-persistence.test.ts \
            tests/integration/postgres-billing-period-command-atomicity.test.ts \
            tests/integration/postgres-billing-invoice-command-atomicity.test.ts \
            tests/integration/postgres-billing-reality-dependencies.test.ts \
            tests/integration/postgres-noncapital-cycle-owner-v2.test.ts \
            tests/integration/postgres-org-live-enable-atomicity.test.ts
          node scripts/postgres-validation/assert-capital-test-results.mjs .tmp/capital-postgres-results.json

  integration:
    name: postgres migrate + integration guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_it"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude (roles + auth.users) + apply Postgres migrations
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Drizzle + postgres-js smoke (insert/select/delete, FK-safe)
        run: pnpm db:smoke:postgres
      - name: Historical complete migration journal regression
        run: pnpm test --run tests/unit/fhv-v2-postgres-schema-preflight.test.ts
      - name: DEE-651 TEST_ONLY Decision → Risk → Execution V2 proof
        env:
          WAIA_PG_INTEGRATION: "1"
          FHV_TEST_ONLY_EXECUTION_V2_AUTHORITY: "1"
          # The real server-only preparation observer requires the same Node
          # CLI profile used by production entrypoints; this grants no authority.
          WAIA_TRADER_CLI: "1"
        run: >-
          pnpm test --run --no-file-parallelism
          tests/unit/control-replay-scientific-v2-driver-v1.test.ts
          tests/unit/fhv-control-replay-cli.test.ts
          tests/unit/fhv-final-parity-red.test.ts
          tests/unit/fhv-official-path-blockers-red.test.ts
          tests/unit/fhv-official-streaming-red.test.ts
          tests/unit/fhv-public-ceremony-red.test.ts
          tests/unit/fhv-real-htx-preholdout-control-replay.test.ts
          tests/unit/fhv-btc-eth-execution-evidence.test.ts
          tests/integration/trader-capital-path-trace-evidence.test.ts
          tests/integration/fhv-execution-v2-historical-symbol-boundary.test.ts
          tests/integration/postgres-scientific-admission-receipt-v1.test.ts
          tests/integration/postgres-htx-volume-receipt-retry.test.ts
          tests/integration/postgres-forecast-contract-binding-v1.test.ts
          tests/integration/postgres-km-four-surface-production-preflight-v2.test.ts
          tests/integration/postgres-scientific-admission-four-surface-v2.test.ts
          tests/integration/postgres-historical-production-first-cycle-v2.test.ts
          tests/integration/postgres-historical-knowledge-checkpoint-namespace-v2.test.ts
          tests/integration/postgres-historical-simulation-atomic-cycle-v2.test.ts
          tests/integration/postgres-historical-observable-read-model-v2.test.ts
          tests/integration/postgres-historical-runner-least-privilege-v2.test.ts
          tests/integration/postgres-predictive-package-storage-v1.test.ts
          tests/unit/postgres-session-transaction-v2.test.ts
          tests/unit/historical-postgres-ci-cli-profile.test.ts

  historical-postgres17:
    name: PostgreSQL 17 historical regression guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_it"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude and full migrations on PostgreSQL 17
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Create isolated connection-close fixture database
        # Fixed synthetic CI URL, never a production secret or copied dataset.
        run: |
          node --input-type=module <<'NODE'
          import postgres from 'postgres';
          const sql = postgres('postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it', { max: 1 });
          try {
            await sql.unsafe('CREATE DATABASE waia_test_dee962_close TEMPLATE template0');
          } finally {
            await sql.end({ timeout: 5 });
          }
          NODE
      - name: Real Forecast persistence, portable identity and reserved disconnect
        env:
          WAIA_PG_INTEGRATION: "1"
          WAIA_TEST_POSTGRES_SESSION_CLOSE_URL: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_test_dee962_close
        run: >-
          pnpm test --run --no-file-parallelism
          tests/integration/postgres-forecast-v2-persistence.test.ts
          tests/integration/postgres-historical-dataset-registration-portable-v2.test.ts
          tests/integration/postgres-reserved-close-guard.test.ts
      - name: Restricted-owner preparation journal and actual two-connection runner LOGIN
        # Must follow full migrations (runner role exists) and other suites:
        # this isolated fixture provisions a cluster-level LOGIN of its own.
        env:
          WAIA_TEST_DEE958_PG_ADMIN_URL: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it
        run: pnpm test --run tests/integration/historical-preparation-events-v2.test.ts

  admin-console-postgres:
    name: admin console change log on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_it"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude (roles + auth.users) + apply Postgres migrations
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Admin console change log on Postgres
        env:
          WAIA_PG_INTEGRATION: "1"
        run: >-
          pnpm test --run --no-file-parallelism
          --exclude tests/integration/admin-console-change-log-overhead-postgres.test.ts
          tests/integration/admin-console-*.test.ts

  admin-console-overhead-postgres:
    name: admin console change-log overhead profile 9.3.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_profile
          POSTGRES_PASSWORD: waia_profile_local_only
          POSTGRES_DB: waia_profile
        ports:
          - 54328:5432
        options: >-
          --health-cmd "pg_isready -U waia_profile -d waia_profile"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_POSTGRES: postgresql://waia_profile:waia_profile_local_only@127.0.0.1:54328/waia_profile
      DATABASE_URL_POSTGRES_SESSION: postgresql://waia_profile:waia_profile_local_only@127.0.0.1:54328/waia_profile
      WAIA_PG_INTEGRATION: "1"
      WAIA_ADMIN_CONSOLE_PROFILE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude and migrations on the isolated profile database
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: 5000 real writes with triggers and without
        run: pnpm test --run tests/integration/admin-console-change-log-overhead-postgres.test.ts

  admin-console-pg-e2e:
    name: admin console slice and SLO on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_e2e
          POSTGRES_PASSWORD: waia_e2e_local_only
          POSTGRES_DB: waia_e2e
        ports:
          - 54327:5432
        options: >-
          --health-cmd "pg_isready -U waia_e2e -d waia_e2e"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_POSTGRES: postgresql://waia_e2e:waia_e2e_local_only@127.0.0.1:54327/waia_e2e
      DATABASE_URL_POSTGRES_SESSION: postgresql://waia_e2e:waia_e2e_local_only@127.0.0.1:54327/waia_e2e
      WAIA_DB_BACKEND: sqlite
      WAIA_ADMIN_CONSOLE_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude and migrations on the isolated e2e database
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Slice gate and SLO
        run: pnpm test:e2e:admin-pg

  admin-console-billing-postgres:
    name: admin console billing idempotency on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_validate
          POSTGRES_PASSWORD: waia_validate_local_only
          POSTGRES_DB: waia_validate
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U waia_validate -d waia_validate"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_POSTGRES: postgresql://waia_validate:waia_validate_local_only@127.0.0.1:54329/waia_validate
      DATABASE_URL_POSTGRES_SESSION: postgresql://waia_validate:waia_validate_local_only@127.0.0.1:54329/waia_validate
      WAIA_PG_INTEGRATION: "1"
      WAIA_DB_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude (roles + auth.users) + apply Postgres migrations
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Billing parity and idempotency on the CI validate identity (no skipped proof)
        run: |
          mkdir -p .tmp
          rm -f .tmp/billing-parity-postgres-results.json
          pnpm test --run --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/billing-parity-postgres-results.json \
            tests/integration/admin-console-billing-idempotency-postgres.test.ts \
            tests/integration/postgres-reporting-period-parity.test.ts \
            tests/integration/postgres-invoice-issuance-parity.test.ts
          node scripts/postgres-validation/assert-billing-parity-test-results.mjs .tmp/billing-parity-postgres-results.json
