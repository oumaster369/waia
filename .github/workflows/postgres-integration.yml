env:
  DATABASE_URL_POSTGRES: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it
  DATABASE_URL_POSTGRES_SESSION: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it
  # Canonical verification is release-bound. For PRs, github.sha is the
  # synthetic merge commit, so bind receipts to the exact reviewed head.
  WAIA_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dee1205-scheduled-noncapital-postgres:
    name: DEE-1205 scheduled noncapital owner (executed PostgreSQL proof required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_dee1205
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_dee1205"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_POSTGRES: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_dee1205
      DATABASE_URL_POSTGRES_SESSION: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_dee1205
      WAIA_DB_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude and current journal on fresh synthetic PostgreSQL 16
        env:
          WAIA_POSTGRES_CLI: "1"
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Bind exact reviewed source and disposable database before native execution
        run: node scripts/postgres-validation/prepare-dee1205-postgres-proof.mjs
      - name: Probe scheduled Worker PostgreSQL transport faults and TLS
        run: node scripts/postgres-validation/probe-dee1213-worker-transport.mjs --output .tmp/dee1213-worker-transport.json
      - name: Prove scheduled pool cleanup on actual Worker TLS and synthetic PostgreSQL
        run: node scripts/postgres-validation/probe-dee1213-worker-pool.mjs --output .tmp/dee1213-worker-pool.json
      - name: Execute the closed scheduled-owner native file with zero skips
        env:
          WAIA_PG_INTEGRATION: "1"
          WAIA_TRADER_CLI: "1"
          WAIA_POSTGRES_CLI: "1"
        run: |
          mkdir -p .tmp
          rm -f .tmp/dee1205-postgres-results.json
          set +e
          pnpm test --run --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/dee1205-postgres-results.json \
            tests/integration/postgres-scheduled-paper-owner-v1.test.ts
          test_status=$?
          node scripts/postgres-validation/assert-dee1205-postgres-results.mjs .tmp/dee1205-postgres-results.json
          guard_status=$?
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$guard_status"
      - name: Retain exact source manifest and Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dee1205-postgres-proof-${{ github.run_attempt }}
          path: |
            .tmp/dee1205-postgres-source-manifest.json
            .tmp/dee1205-postgres-results.json
            .tmp/dee1213-worker-transport.json
            .tmp/dee1213-worker-pool.json
          if-no-files-found: warn

  dee1200-registered-training-postgres:
    name: DEE-1200 registered research training (executed PostgreSQL proof required)
