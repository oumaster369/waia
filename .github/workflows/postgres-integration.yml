# Postgres integration checks (DEE-64 D6-pre; restored DEE-287).
# Applies every Postgres migration from an empty DB through the latest journal
# entry against bare postgres:16-alpine, then runs the driver smoke.
#
# Triggers:
#   * workflow_dispatch — manual full run from the Actions tab.
#   * pull_request (path-filtered) — auto-runs on migration-bearing PRs so the
#     Postgres apply surface is validated before merge (no more blind waivers).
# Default CI stays SQLite-only (see ci.yml).

name: postgres-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "db/migrations_postgres/**"
      - "db/schema.postgres.ts"
      - "scripts/postgres-validation/**"
      - "lib/trader/execution/v2/**"
      - "lib/trader/observability/control-replay-scientific-v2-driver-v1.ts"
      - "lib/trader/observability/fhv-control-replay-execution.ts"
      - "scripts/trader/fhv-control-replay-cli.ts"
      - "tests/helpers/execution-v2-test-only-postgres.ts"
      - "tests/unit/control-replay-scientific-v2-driver-v1.test.ts"
      - "tests/unit/fhv-control-replay-cli.test.ts"
      - "tests/unit/fhv-final-parity-red.test.ts"
      - "tests/unit/fhv-official-path-blockers-red.test.ts"
      - "tests/unit/fhv-official-streaming-red.test.ts"
      - "tests/unit/fhv-public-ceremony-red.test.ts"
      - "tests/unit/fhv-real-htx-preholdout-control-replay.test.ts"
      - "tests/unit/fhv-btc-eth-execution-evidence.test.ts"
      - "tests/integration/trader-capital-path-trace-evidence.test.ts"
      - "tests/integration/fhv-execution-v2-historical-symbol-boundary.test.ts"
      - "lib/trader/research/execopp-qualification/scientific-admission-receipt-service-v2.ts"
      - "lib/trader/research/execopp-qualification/scientific-admission-v2.ts"
      - "tests/integration/postgres-scientific-admission-receipt-v1.test.ts"
      - "lib/trader/intelligence/forecast-v2/forecast-contract-binding-service-v1.ts"
      - "tests/integration/postgres-forecast-contract-binding-v1.test.ts"
      - "drizzle.postgres.config.ts"
      - ".github/workflows/postgres-integration.yml"

env:
  DATABASE_URL_POSTGRES: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it

jobs:
  integration:
    name: postgres migrate + integration guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_it"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude (roles + auth.users) + apply Postgres migrations
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Drizzle + postgres-js smoke (insert/select/delete, FK-safe)
        run: pnpm db:smoke:postgres
      - name: DEE-651 TEST_ONLY Decision → Risk → Execution V2 proof
        env:
          WAIA_PG_INTEGRATION: "1"
          FHV_TEST_ONLY_EXECUTION_V2_AUTHORITY: "1"
        run: >-
          pnpm test --run --no-file-parallelism
          tests/unit/control-replay-scientific-v2-driver-v1.test.ts
          tests/unit/fhv-control-replay-cli.test.ts
          tests/unit/fhv-final-parity-red.test.ts
          tests/unit/fhv-official-path-blockers-red.test.ts
          tests/unit/fhv-official-streaming-red.test.ts
          tests/unit/fhv-public-ceremony-red.test.ts
          tests/unit/fhv-real-htx-preholdout-control-replay.test.ts
          tests/unit/fhv-btc-eth-execution-evidence.test.ts
          tests/integration/trader-capital-path-trace-evidence.test.ts
          tests/integration/fhv-execution-v2-historical-symbol-boundary.test.ts
          tests/integration/postgres-scientific-admission-receipt-v1.test.ts
          tests/integration/postgres-forecast-contract-binding-v1.test.ts
