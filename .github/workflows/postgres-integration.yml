# Postgres integration checks (DEE-64 D6-pre; restored DEE-287).
# Applies every Postgres migration from an empty DB through the latest journal
# entry against bare postgres:16-alpine, then runs the driver smoke.
#
# Triggers:
#   * workflow_dispatch — manual full run from the Actions tab.
#   * pull_request (path-filtered) — auto-runs on migration-bearing PRs so the
#     Postgres apply surface is validated before merge (no more blind waivers).
# Default CI stays SQLite-only (see ci.yml).

name: postgres-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "db/migrations_postgres/**"
      - "db/schema.postgres.ts"
      - "scripts/postgres-validation/**"
      - "drizzle.postgres.config.ts"
      - ".github/workflows/postgres-integration.yml"

env:
  DATABASE_URL_POSTGRES: postgresql://waia_it:waia_it@127.0.0.1:5432/waia_it

jobs:
  integration:
    name: postgres migrate + integration guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waia_it
          POSTGRES_PASSWORD: waia_it
          POSTGRES_DB: waia_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waia_it -d waia_it"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Auth prelude (roles + auth.users) + apply Postgres migrations
        run: pnpm db:postgres:auth-prelude && pnpm db:migrate:postgres
      - name: Drizzle + postgres-js smoke (insert/select/delete, FK-safe)
        run: pnpm db:smoke:postgres
      # NOTE: the opt-in `WAIA_PG_INTEGRATION=1` parity suite
      # (tests/integration/postgres-*.test.ts) is intentionally NOT run here.
      # It has pre-existing, DEE-287-unrelated fixture-parity failures (SQLite-style
      # non-canonical UUID literals rejected by Postgres `uuid`, tests not seeding
      # `auth.users` before `public.users`, `text = uuid` comparisons). DEE-287 scopes
      # this workflow to migration-apply + driver smoke; the parity-fixture cleanup is
      # tracked separately (see docs/migrations/DEE-287-POSTGRES-VALIDATION-PRELUDE.md).
